name: bcgnet_TF230
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.8.1
  - jupyterlab
  - pip
  - pip:
      # Choose ONE TensorFlow line:
      - tensorflow-gpu==2.3.0        # GPU build
      # - tensorflow==2.3.0          # CPU-only (use this instead of the GPU line above)

      - mne==0.20.7
      - scipy==1.4.1
      - matplotlib
      - tabulate
      - pyyaml
      - easydict

      # Fix for "Descriptors cannot be created directly" with TF 2.3
      - protobuf==3.20.3
      - grpcio==1.32.0
